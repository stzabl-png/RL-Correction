schema_version: 1
robot: dexmate
camera:
  name: head_left
  host: 192.168.50.22
  port: 30000
  expected_serial: 59595115
  expected_resolution:
    width: 1920
    height: 1200
  zed_mode: HD1200
  image_view: LEFT
  image_geometry: rectified
  distortion_model: none
ssh:
  thor_alias: dexmate
  nano_alias: dexmate-nano
  nano_direct_alias: dexmate-nano-direct
  thor_target: dexmate@192.168.50.20
  nano_target: dexmate-nano@192.168.50.22
  quickstart_route: auto
streamer:
  binary: /home/dexmate-nano/zed_stream/build/zed_streamer
  quickstart_use_sudo: true
  quickstart_uses_clean: false
  lifecycle: attached_ssh_session
  arguments:
    - --jpeg-quality
    - "100"
    - --max-fps
    - "30"
    - --resolution
    - HD1200
    - --no-right
    - --no-depth
    - --no-pc
    - --no-imu
