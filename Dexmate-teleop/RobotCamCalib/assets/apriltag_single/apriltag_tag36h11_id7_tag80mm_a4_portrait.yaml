schema: robot_cam_calib.apriltag_board.v1
name: apriltag_tag36h11_id7_tag80mm_a4_portrait
family: tag36h11
units: mm
layout:
  rows: 1
  cols: 1
  tag_id_start: 7
  tag_id_end: 7
geometry:
  tag_size_mm: 80.0
  marker_fraction: 0.6666666666666666
  tile_size_mm: 120.0
  explicit_gap_mm: 0.0
  pitch_mm: 120.0
  black_marker_edge_gap_mm: 40.0
  board_size_mm:
  - 120.0
  - 120.0
  quiet_zone_mm: 20.0
