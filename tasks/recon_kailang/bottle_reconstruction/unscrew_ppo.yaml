# 扭盖任务 PPO 配置 — 超参照抄 tasks/pregrasp/ppo.yaml (同一机器人+同一物理上标定),
# 含 2026-08-03 裁定的 kl_threshold=0.02 (HANDOFF: 唯一有效的改动).
# priv = 质量1 + 摩擦1 + 指尖力5 (基类原样, priv_info_dim=7).
seed: 42
algo: PPO
device: cuda
network:
  mlp:
    units: [512, 256, 128]
  priv_mlp:
    units: [64, 32, 8]
  separate_critic: True
  actor_priv_dim: 7
  sigma_floor: 0.02
  sigma_init: 0.1
  mu_init_scale: 0.01

load_path: None

algorithm:
  experiment_name: 'Unscrew_0'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: 1024
  normalize_advantage: True
  gamma: 0.99
  tau: 0.95
  learning_rate: 3e-4
  kl_threshold: 0.02
  max_lr: 3e-4
  min_lr: 3e-5
  horizon_length: 32
  minibatch_size: 8192
  mini_epochs: 5
  critic_warmup_iters: 10
  clip_value: True
  critic_coef: 1
  entropy_coef: 0.001
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  truncate_grads: True
  grad_norm: 1.0
  save_best_after: 0
  save_frequency: 40
  max_agent_steps: 40000000
  priv_info: True
  priv_info_dim: 7
  priv_info_embed_dim: 8
