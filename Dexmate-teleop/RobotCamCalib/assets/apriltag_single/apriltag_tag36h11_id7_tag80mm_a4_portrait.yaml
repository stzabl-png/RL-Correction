  - - 40.0
    - -40.0
    - 0.0
  - - -40.0
    - -40.0
    - 0.0
  description: Use each detection's four image corners in this exact order with the
    matching corners_board_mm entry for bundle PnP.
usage:
  board_min_tags: 1
  note: A single tag gives solvePnP only four coplanar points, which admits a two-fold
    planar pose ambiguity. Print it as large as the working distance allows and avoid
    near-fronto-parallel views, where the two solutions are hardest to tell apart.
